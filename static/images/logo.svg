<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1769E0" />
      <stop offset="100%" stop-color="#20B486" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20B486" />
      <stop offset="100%" stop-color="#1769E0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1769E0" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Icon Graphic -->
  <g transform="translate(6, 6)" filter="url(#glow)">
    <!-- Protective Shield / Rounded Heart shape -->
    <path d="M26 2 C38 2, 48 8, 48 20 C48 35, 26 48, 26 48 C26 48, 4 35, 4 20 C4 8, 14 2, 26 2 Z" 
          fill="url(#primaryGrad)" />
    
    <!-- Inner Accent Heart Glow -->
    <path d="M26 6 C35 6, 44 11, 44 20 C44 32, 26 43, 26 43 C26 43, 8 32, 8 20 C8 11, 17 6, 26 6 Z" 
          fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5" />

    <!-- Medical Cross (+) in clean white -->
    <rect x="23" y="14" width="6" height="18" rx="3" fill="#FFFFFF" />
    <rect x="17" y="20" width="18" height="6" rx="3" fill="#FFFFFF" />
    
    <!-- Small vitality dot -->
    <circle cx="34" cy="14" r="2.5" fill="#EAF3FF" />
  </g>

  <!-- Typography -->
  <text x="68" y="34" font-family="'Inter', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="24" fill="#102A43" letter-spacing="-0.5">
    Medi<tspan fill="#1769E0">Care</tspan> <tspan fill="#20B486">Hub</tspan>
  </text>
  <text x="69" y="49" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="9" fill="#627D98" letter-spacing="0.8">
    FAMILY MEDICINE &amp; PHARMACY
  </text>
</svg>

