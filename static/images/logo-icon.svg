<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1769E0" />
      <stop offset="100%" stop-color="#20B486" />
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1769E0" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#iconGlow)">
    <!-- Protective Shield / Rounded Heart shape -->
    <path d="M32 4 C46 4, 58 12, 58 26 C58 44, 32 58, 32 58 C32 58, 6 44, 6 26 C6 12, 18 4, 32 4 Z" 
          fill="url(#iconGrad)" />
    
    <!-- Inner Accent Line -->
    <path d="M32 8 C43 8, 53 14, 53 26 C53 40, 32 52, 32 52 C32 52, 11 40, 11 26 C11 14, 21 8, 32 8 Z" 
          fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" />

    <!-- Medical Cross (+) -->
    <rect x="28" y="18" width="8" height="22" rx="4" fill="#FFFFFF" />
    <rect x="21" y="25" width="22" height="8" rx="4" fill="#FFFFFF" />
    
    <!-- Vitality Sparkle -->
    <circle cx="42" cy="18" r="3" fill="#EAF3FF" />
  </g>
</svg>

